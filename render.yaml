services:
  - type: web
    name: ai-erp-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        fromDatabase:
          name: ai-erp-mongo
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 3000